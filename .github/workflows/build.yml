name: Build Witness APK

# 最小权限：checkout 读代码即可；产物上传不需要额外权限
permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 完整历史 + tags：版本号校验需要 git describe 能看到 tag
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"

      # debug^2: cross-compile the C extension for Android arm64.
      # Chaquopy's pip cannot build native code (it uses a placeholder
      # compiler), so we build the .so manually with the NDK and place it
      # in src/main/python/ where Chaquopy packages it.
      # Only runs on branches with core/cext/curve_ext.c (i.e. exp/ct-curve).
      - name: Cross-compile curve_ext for Android
        if: hashFiles('core/cext/curve_ext.c') != ''
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export NDK=$ANDROID_HOME/ndk/26.1.10909125
          export CC=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          PYVER=$(python3 -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          sudo apt-get update -qq && sudo apt-get install -y -qq python${PYVER}-dev > /dev/null
          # Local include dir: copy Python headers, replace the multiarch
          # pyconfig.h with a minimal Android arm64 version.
          mkdir -p /tmp/pyinclude
          cp -r /usr/include/python${PYVER}/* /tmp/pyinclude/
          cat > /tmp/pyinclude/pyconfig.h <<'EOF'
          /* Minimal pyconfig.h for Android arm64 (LP64 little-endian) */
          #define HAVE_STDIO_H 1
          #define HAVE_STDLIB_H 1
          #define HAVE_STRING_H 1
          #define HAVE_ERRNO_H 1
          #define HAVE_LIMITS_H 1
          #define SIZEOF_INT 4
          #define SIZEOF_LONG 8
          #define SIZEOF_LONG_LONG 8
          #define SIZEOF_VOID_P 8
          #define SIZEOF_SIZE_T 8
          #define SIZEOF_TIME_T 8
          #define SIZEOF_WCHAR_T 4
          #define HAVE_LONG_LONG 1
          #define HAVE_SSIZE_T 1
          #define PY_FORMAT_SIZE_T "z"
          #define HAVE_PTHREAD_H 1
          #define HAVE_PTHREAD_ATFORK 1
          #define _REENTRANT 1
          EOF
          $CC -shared -fPIC -O2 -std=c99 -Wall \
            -I/tmp/pyinclude \
            -DANDROID \
            core/cext/curve_ext.c \
            -o app/app/src/main/python/curve_ext.so
          ls -lh app/app/src/main/python/curve_ext.so
          file app/app/src/main/python/curve_ext.so

      # debug^3: Rust + Zig backends (plain C ABI via ctypes, no Python.h).
      # Only runs on branches with core/rsext / core/zigext.
      - name: Cross-compile Rust backend for Android
        if: hashFiles('core/rsext/src/lib.rs') != ''
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export NDK=$ANDROID_HOME/ndk/26.1.10909125
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y -q
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add aarch64-linux-android
          mkdir -p core/rsext/.cargo
          cat > core/rsext/.cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
          EOF
          cd core/rsext && cargo build --release --target aarch64-linux-android
          cp target/aarch64-linux-android/release/libcurve_rs.so \
             ../../app/app/src/main/python/libcurve_rs.so
          file ../../app/app/src/main/python/libcurve_rs.so

      - name: Cross-compile Zig backend for Android
        if: hashFiles('core/zigext/curve.zig') != ''
        run: |
          ZIGV=0.15.1
          curl -sSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIGV}/zig-x86_64-linux-${ZIGV}.tar.xz"
          tar -xf /tmp/zig.tar.xz -C /tmp
          /tmp/zig-x86_64-linux-${ZIGV}/zig build-lib core/zigext/curve.zig \
            -dynamic -target aarch64-linux-android -O ReleaseFast \
            -femit-bin=app/app/src/main/python/libcurve_zig.so
          file app/app/src/main/python/libcurve_zig.so

      # 增量构建：缓存 Gradle 发行版与全部依赖下载
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # ZK 核心由 app/app/build.gradle 在配置期拷进 Chaquopy 目录
      #（F-Droid 从干净 checkout 构建也需要它，不能只放在 CI workflow 里；
      # 注意不能用 preBuild 时的任务来拷：Chaquopy 的 merge*PythonSources
      # 跑在 preBuild 之前，那样拷进去的文件进不了 app.imy）。

      # 桥接一致性检查：JS 调 WitnessApi.xxx() 必须在 Java 有
      # @JavascriptInterface 方法，Java callAttr("yyy") 必须在
      # zk_api.py 有对应函数。
      - name: Check bridge consistency
        run: |
          python3 - <<'EOF'
          import re
          js = open("app/app/src/main/assets/www/index.html", encoding="utf-8").read()
          java = open("app/app/src/main/java/com/witness/app/ZkBridge.java", encoding="utf-8").read()
          py = open("app/app/src/main/python/zk_api.py", encoding="utf-8").read()
          js_calls = set(re.findall(r'(?:WitnessApi|api\(\))\.(\w+)\(', js))
          java_methods = set(re.findall(r'public String (\w+)\(', java))
          py_calls = set(re.findall(r'callAttr\("(\w+)"', java))
          py_defs = set(re.findall(r'^def (\w+)\(', py, re.M))
          missing = (js_calls - java_methods) | (py_calls - py_defs)
          assert not missing, f"桥接缺失: {missing}"
          print(f"桥接一致: JS {len(js_calls)} / Java {len(java_methods)} / Python {len(py_defs)}")
          EOF

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > /tmp/witness-release.keystore

      - name: Build release APK
        env:
          WITNESS_KEYSTORE_PATH: /tmp/witness-release.keystore
          WITNESS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          WITNESS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          WITNESS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          # 版本号手写在 app/app/build.gradle；如果打了 tag，tag 的版本必须与
          # build.gradle 的 versionName 一致，否则直接失败，防止发版时忘改。
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            VER=${TAG#v}
            VER=${VER%%-*}  # strip -debug3 etc.: v5.0-debug3 -> 5.0
            GVER=$(grep -oP 'versionName "\K[^"]+' app/app/build.gradle)
            GCODE=$(grep -oP 'versionCode \K[0-9]+' app/app/build.gradle | head -1)
            if [ "$VER" != "$GVER" ]; then
              echo "tag $TAG 与 build.gradle versionName $GVER 不一致" >&2
              exit 1
            fi
            echo "version=$GVER ($GCODE)"
          fi
          cd app && ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: witness-apk
          path: app/app/build/outputs/apk/release/*.apk
