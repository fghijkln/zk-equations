apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.witness.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.witness.app"
        minSdk 24
        targetSdk 34
        // 版本号手写在这里（发版时同步改）；CI 会校验 versionName 与 git tag 一致，
        // 不一致则构建失败。
        versionCode 8
        versionName "0.4.3"

        ndk {
            // 只留 arm64
            abiFilters "arm64-v8a"
        }

        python {
            // core/ 为纯标准库实现；curve_ext 是 debug^2 分支的 C 扩展
            //（constant-time 曲线运算），通过 pip 从源码编译进 APK。
            version "3.11"
            pip {
                // 本地路径：core/cext/setup.py（Chaquopy 会用 Android NDK 编译）
                install "../../core/cext"
            }
        }
    }

    signingConfigs {
        release {
            // CI 从 Secrets 注入；本地构建没有这些环境变量时用 debug 签名代替
            def ksPath = System.getenv("WITNESS_KEYSTORE_PATH")
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("WITNESS_KEYSTORE_PASSWORD")
                keyAlias System.getenv("WITNESS_KEY_ALIAS")
                keyPassword System.getenv("WITNESS_KEY_PASSWORD")
            } else {
                initWith signingConfigs.debug
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The ZK core is pure Python in ../../core (repo root). F-Droid builds
// from a clean checkout and never runs our CI workflow, so stage it
// into Chaquopy's source dir here, before anything else runs.
// (Plain project.copy in doLast: avoids Gradle 8's strict Copy-task
// input/output validation on the Chaquopy source dir.)
tasks.register('stagePythonCore') {
    doLast {
        copy {
            from '../../core'
            include '*.py'
            into 'src/main/python/core'
        }
    }
}
tasks.named('preBuild') { dependsOn 'stagePythonCore' }
