AutoName: Witness
Summary: Zero-knowledge proofs for arithmetic equations
Description: |-
  Witness proves you know a solution to an equation — e.g. "I know x such
  that x³+2x+5=38" — without revealing x. It uses Bulletproofs
  arithmetic-circuit proofs implemented in pure Python: no trusted setup,
  no pairings, fully on-device.

  Features: integer and decimal equations, transcendental functions
  (sin/cos/exp/ln via Chebyshev approximation polynomials) with a strict
  precision guarantee (witness within 1/(k·10⁴) of the exact root, enforced
  before proving), and a built-in numerical equation solver.

  Zero permissions: no internet access or any system permission required.

  Learning-grade cryptography: the math is real but not audited. Do not
  use it to protect real assets.

